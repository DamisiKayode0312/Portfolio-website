<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Every project in Victoria's Gallery on one page: LOCIT, Fairy Job Mother, News Corp product strategy, AI evaluation and a Raspberry Pi logger.">
<meta property="og:title" content="All work · Victoria Kayode">
<meta property="og:description" content="Computer engineer working across product, AI and project engineering. Case studies, experience and art by Victoria Kayode.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://damisikayode0312.github.io/Portfolio-website/work.html">
<meta property="og:image" content="https://damisikayode0312.github.io/Portfolio-website/assets/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Victoria Kayode&#39;s name under a row of gilt frames holding her projects and paintings.">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://damisikayode0312.github.io/Portfolio-website/work.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..600;1,6..72,200..600&family=Pinyon+Script&family=DM+Sans:opsz,wght@9..40,300..600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/soft.css">
<style>
  body{background:var(--parchment)}
  .qv{max-width:var(--max);margin:0 auto;padding:20px var(--gutter) 56px}
  .qv-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:20px}
  .qv-top a{display:inline-flex;align-items:center;min-height:44px;color:var(--burgundy-ink);font-weight:600;text-underline-offset:3px}
  .qv h1{font-size:clamp(32px,8vw,52px);color:var(--burgundy-ink)}
  .qv .intro{margin:8px 0 24px;max-width:60ch}
  .grid{list-style:none;margin:0;padding:0;display:grid;gap:16px}
  @media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{display:grid;gap:8px;height:100%;padding:16px;border-radius:var(--r-img);background:#FFFDFA;box-shadow:var(--soft-lift);text-decoration:none;color:var(--ink)}
  .card img,.card .frame-ph{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;background:#fff}
  .card .frame-ph{border-radius:8px}
  .card .logo-ph{display:grid;place-items:center;aspect-ratio:16/10;border-radius:8px;background:#F4EFE8}
  .card .logo-ph img{width:auto;height:auto;max-width:56%;max-height:42%;aspect-ratio:auto;object-fit:contain;background:none;border-radius:0}
  .card h2{font-size:22px;font-weight:400;letter-spacing:-.01em;color:var(--burgundy-ink)}
  .card .cat{font:400 13px/1.4 var(--font-body);letter-spacing:.02em;color:var(--muted)}
  .card .go{color:var(--burgundy-ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}
  .qv-foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
</style>
<script>document.documentElement.classList.replace('no-js','js');</script>
</head>
<body>
<main class="qv">
  <div class="qv-top"><a href="index.html#home">‹ Victoria’s Gallery</a><a href="index.html#contact">Contact</a></div>
  <h1 data-swash>All work</h1>
  <p class="intro">Every project on one page. Open any of them for the full case study, or take the <a href="index.html">museum tour</a>.</p>
  <ul class="grid" id="grid"><li>Loading…</li></ul>
  <div class="qv-foot" id="foot"></div>
</main>
<script>
fetch('data/exhibits.json').then(function(r){return r.json();}).then(function(d){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  document.getElementById('grid').innerHTML=d.exhibits.map(function(x){
    return '<li><a class="card" href="case-study.html?p='+encodeURIComponent(x.slug)+'">'+(x.image?'<img src="'+esc(x.image.src)+'" alt="'+esc(x.image.alt)+'" loading="lazy">':x.logo?'<div class="logo-ph"><img src="'+esc(x.logo.src)+'" alt="'+esc(x.logo.alt)+'" loading="lazy"></div>':'<div class="frame-ph">Placeholder · Project image needed</div>')+
      '<span class="cat">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.teaser)+'</p><span class="go">Read the case study</span></a></li>';}).join('');
});
fetch('data/site.json').then(function(r){return r.json();}).then(function(s){
  document.getElementById('foot').innerHTML=(s.resume&&s.resume.href?'<a class="btn btn-primary" href="'+s.resume.href+'" download>Download résumé</a>':'<span class="btn btn-primary" aria-disabled="true">Résumé coming soon</span>')+'<a class="btn btn-secondary" href="index.html#contact">Contact</a>';
});
</script>
<script src="js/swash.js" defer></script>
</body>
</html>
